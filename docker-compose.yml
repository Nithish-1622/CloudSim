version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudsim_postgres
    environment:
      POSTGRES_USER: cloudsim
      POSTGRES_PASSWORD: cloudsim_secret
      POSTGRES_DB: cloudsim_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudsim -d cloudsim_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloudsim_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cloudsim_api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      API_PORT: 4000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://cloudsim:cloudsim_secret@postgres:5432/cloudsim_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: cloudsim-dev-super-secret-jwt-key-2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spy", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: cloudsim_worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://cloudsim:cloudsim_secret@postgres:5432/cloudsim_db?schema=public
      REDIS_URL: redis://redis:6379
      API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cloudsim_web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
